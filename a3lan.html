<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجهيز التحميل</title>
    
    <!-- فحص PS3 والتحويل المباشر -->
    <script>
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('playstation 3') !== -1 || ua.indexOf('ps3') !== -1) {
            var match = location.search.match(/file=([^&]*)/);
            if (match && match[1]) {
                window.location.href = decodeURIComponent(match[1]);
            }
        }
    </script>

    <!-- كود إعلان Popunder -->
    <script data-cfasync="false" src="https://abscloud.org/1/717617263390869e3522f6b247e925b4"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .wrapper {
            text-align: center;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        h1 { font-size: 20px; margin-bottom: 10px; font-weight: 600; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .counter-circle {
            width: 70px; height: 70px;
            border: 4px solid #3b82f6; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px auto; font-size: 24px; font-weight: bold;
            color: #60a5fa; background: rgba(59, 130, 246, 0.05);
        }
        .btn-dl {
            display: none;
            background: #2563eb; color: white;
            padding: 14px 20px; border-radius: 8px;
            text-decoration: none; font-weight: 600; font-size: 15px;
            width: 100%; border: none; cursor: pointer;
        }
        .btn-dl:hover { background: #1d4ed8; }
        .ad-space { margin-top: 20px; display: flex; justify-content: center; overflow: hidden; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1>جاري تجهيز الرابط</h1>
        <p>يرجى الانتظار ثوانٍ معدودة حتى يتم تجهيز الملف للتحميل.</p>
        
        <div class="counter-circle" id="countdown">10</div>

        <!-- زر التحميل -->
        <button id="actionBtn" class="btn-dl">تحميل الملف الآن</button>

        <!-- مكان إعلان البانر (300x250) -->
        <div class="ad-space">
            <script>
              atOptions = {
                'key' : '8bff4ab7e91d7061e96ae861723ae45f',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://bellnewyork.org/22/8bff4ab7e91d7061e96ae861723ae45f"></script>
        </div>
    </div>

    <script>
        // استخراج الرابط
        var match = location.search.match(/file=([^&]*)/);
        var targetUrl = match ? decodeURIComponent(match[1]) : '';
        var actionBtn = document.getElementById('actionBtn');

        // معالجة الضغطة بشكل برمجي يمنع مشكلة الضغطتين
        actionBtn.onclick = function() {
            if (targetUrl) {
                window.open(targetUrl, '_blank');
            } else {
                alert("خطأ: رابط الملف غير موجود!");
            }
        };

        // عداد الـ 10 ثوانٍ
        var t = 10;
        var el = document.getElementById('countdown');
        
        var x = setInterval(function() {
            t--;
            el.textContent = t;
            if (t <= 0) {
                clearInterval(x);
                el.style.display = 'none'; 
                actionBtn.style.display = 'block'; 
            }
        }, 1000);
    </script>

</body>
</html>
