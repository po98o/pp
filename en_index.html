<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PS3 MAXROW - English</title>
<style>
body {
  background-color: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 0;
}
h1 {
  background: #222;
  padding: 15px;
  font-size: 28px;
  margin: 0;
  color: #00ffff;
}
nav {
  margin-top: 20px;
}
.menu {
  display: inline-block;
  background: #333;
  margin: 10px;
  border-radius: 10px;
  overflow: hidden;
  width: 300px;
}
.menu > a {
  display: flex;
  justify-content: center;
  align-items: center;
  background: #444;
  padding: 0; 
  color: white;
  text-decoration: none;
  cursor: pointer;
  height: 60px; 
}
.menu > a:hover {
  background: #00aaff;
}

.menu > a img {
  max-width: 90%; 
  height: auto;
  display: block;
}

.submenu {
  display: none;
  background: #222;
}
.submenu a {
  display: block;
  padding: 10px;
  font-size: 18px;
  color: #ccc;
  text-decoration: none;
  border-top: 1px solid #333;
}
.submenu a:hover {
  background: #005577;
  color: white;
}

.lang-section {
  margin: 30px 0;
  clear: both;
}
.lang-btn {
  display: inline-block;
  background: #222;
  padding: 10px 20px;
  color: #00ffff;
  text-decoration: none;
  border: 1px solid #444;
  border-radius: 15px;
  font-size: 16px;
}
.lang-btn:hover {
  background: #00aaff;
  color: white;
}

/* تنسيق حاوية الإعلان */
.ad-box {
  margin: 20px auto;
  display: none; /* مخفي افتراضياً للـ PS3 */
  max-width: 320px;
}
</style>
</head>
<body>

</div>

  <div class="menu">

<!-- استدعاء ملف الروابط المركزي وتعبئة القوائم الإنجليزية تلقائياً -->
<script src="files.js"></script>
<script>
  // 1. تعبئة القوائم بالأسماء الإنجليزية من نفس ملف files.js
  const categoryMapEn = {
    "stores": "menu-stores",
    "programs": "menu-programs",
    "trophies": "menu-trophies",
    "arabization": "menu-arabization",
    "mods": "menu-mods",
    "games": "menu-games"
  };

  if (typeof siteFiles !== 'undefined') {
    siteFiles.forEach(item => {
      let containerId = categoryMapEn[item.category];
      if (containerId) {
        let container = document.getElementById(containerId);
        if (container) {
          let finalHref = item.url;
          // توجيه الروابط الخارجية وصفحات التحميل لصفحة الإعلانات
          if (item.url.startsWith("http") || item.url.includes(".html")) {
              if (!item.url.includes("t.me") && !item.url.includes("creators.sa")) {
                  finalHref = "a3lan.html?file=" + encodeURIComponent(item.url);
              }
          }
          container.innerHTML += `<a href="${finalHref}">${item.nameEn}</a>`;
        }
      }
    });
  }

  // 2. دالة القوائم المنسدلة الذكية
  function toggleMenu(element) {
    var currentSubmenu = element.nextElementSibling;
    var allSubmenus = document.getElementsByClassName("submenu");
    
    for (var x = 0; x < allSubmenus.length; x++) {
      if (allSubmenus[x] === currentSubmenu) {
        currentSubmenu.style.display = currentSubmenu.style.display === "block" ? "none" : "block";
      } else {
        allSubmenus[x].style.display = "none";
      }
    }
  }

  // 3. إظهار الإعلانات فقط للجوال والكمبيوتر
  (function() {
      var ua = navigator.userAgent.toLowerCase();
      var isPS3 = ua.indexOf("playstation 3") !== -1 || ua.indexOf("ps3") !== -1;
      if (!isPS3) {
          var adTop = document.getElementById('ad-top');
          var adBottom = document.getElementById('ad-bottom');
          if (adTop) adTop.style.display = 'block';
          if (adBottom) adBottom.style.display = 'block';
      }
  })();
</script>

</body>
</html>
